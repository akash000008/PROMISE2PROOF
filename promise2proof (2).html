<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Promise2Proof | Did you receive what you were promised?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1f3d;--ink:#0f1f3a;--blue:#1a5fe6;--green:#1a8f6a;--bg:#f5f9fd;--line:#e3e9f1;--mut:#7b879b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Space Grotesk","DM Sans",sans-serif;font-weight:400;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:6px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.p{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(26,95,230,.25)}.btn.p:hover{background:#1450c4}.btn.p:disabled{opacity:.6;cursor:wait}
.btn.lg{padding:14px 20px;font-size:15px}.btn.sm{padding:8px 14px;font-size:13px}.btn.g{background:#fff;border:1px solid var(--line);color:var(--ink)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--blue);font-size:11.5px;font-weight:600;letter-spacing:.14em}.eyebrow i{width:26px;height:1.5px;background:var(--blue)}.eyebrow.x{margin-bottom:6px}
.logo{display:inline-flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2b6fff,#123c9c);display:grid;place-items:center;color:#fff;box-shadow:0 8px 14px rgba(18,60,156,.35)}
.lt{font-weight:700;font-size:13px;letter-spacing:.1em}.lt b{color:var(--blue)}.lt.w{color:#fff}
.landing{max-width:1366px;margin:0 auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 98px}.nav nav{display:flex;align-items:center;gap:28px;font-size:13px;color:var(--mut)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;padding:70px 98px 40px;min-height:620px}
.hero h1{font-size:68px;line-height:1.08;margin:22px 0;letter-spacing:-.02em}.hero h1 span,.sh h2 span{color:var(--blue)}
.hero p{font-size:17px;line-height:1.6;color:#5d6b82;max-width:480px}.cta{display:flex;align-items:center;gap:24px;margin:30px 0}.lk{color:var(--blue);font-weight:600;font-size:14px}
.trust{display:flex;gap:22px;font-size:13px;color:var(--mut);flex-wrap:wrap}.trust span{display:flex;gap:6px;align-items:center}.trust svg{color:var(--green)}
.art{position:relative;height:420px}.gb{position:absolute;inset:-10px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px;opacity:.55;-webkit-mask-image:radial-gradient(circle,#000 40%,transparent 75%);mask-image:radial-gradient(circle,#000 40%,transparent 75%)}
.dc{position:absolute;inset:36px 20px auto 40px;background:#fff;border-radius:14px;padding:22px;box-shadow:0 24px 60px rgba(20,45,90,.14)}
.live{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;color:#6b7a90;margin-bottom:16px}.live i{width:9px;height:9px;border-radius:50%;background:var(--green)}
.dr{display:flex;align-items:center;gap:12px}.tile{flex:1;height:138px;border-radius:8px;display:grid;place-items:center}.tile.a{background:linear-gradient(135deg,#cfe0f7,#aecbef);color:#12294d}.tile.b{background:linear-gradient(135deg,#dfe7f1,#c3cfdf)}
.lb{background:#1f3a66;color:#fff;font-weight:700;font-size:34px;padding:12px 16px;transform:rotate(-6deg);text-align:center;box-shadow:8px 8px 0 #aebbd0;line-height:1}.lb small{display:block;font-size:15px;opacity:.75}
.ac{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);flex:none}
.res{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:20px;padding-top:18px;color:#e0a43a}.res div{flex:1;color:var(--ink)}.res strong{display:block;font-size:14px}.res small{color:var(--mut);font-size:11.5px}
.chip{background:#fbefd3;color:#a97a1c;font-size:10px;font-weight:700;letter-spacing:.08em;padding:5px 8px;border-radius:4px}
.fl{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:11.5px;color:#5d6b82;display:flex;gap:8px;align-items:center;box-shadow:0 8px 20px rgba(20,45,90,.1)}.f1{top:-10px;right:-20px}.f1 svg{color:var(--green)}.f2{bottom:-22px;left:-34px;color:var(--blue)}
.sh{margin:0 56px;padding:90px 42px 60px;border-bottom:1px solid var(--line)}.sh h2{font-size:42px;line-height:1.15;margin:8px 0 56px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.step{border-top:1.5px solid #cfd8e6;padding-top:24px}.step small{color:#9aa6b8;font-size:12px}.step svg{display:block;margin:24px 0 18px;color:var(--blue)}.step h3{font-size:18px;margin-bottom:10px}.step p{color:var(--mut);font-size:13.5px;line-height:1.7;max-width:250px;margin:0}
.why{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;border:0}.why h2{margin:0}.fg{display:grid;grid-template-columns:1fr 1fr;gap:40px}.fg svg{color:var(--blue);margin-bottom:16px}.fg h4{font:600 15px "DM Sans";margin-bottom:8px}.fg p{color:var(--mut);font-size:13px;line-height:1.6;margin:0}
.foot{background:var(--navy);display:flex;justify-content:space-between;align-items:center;padding:24px 98px;font-size:12.5px;color:#8fa6c8;margin-top:40px}
.shell{display:grid;grid-template-columns:242px 1fr;min-height:100vh}.side{background:var(--navy);padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sl{font-size:11px;letter-spacing:.14em;color:#7e93b4;margin:42px 11px 12px;font-weight:600}.sk{display:flex;align-items:center;gap:12px;color:#b6c4dc;padding:13px 11px;border-radius:8px;font-size:14px;margin-bottom:4px}.sk span{flex:1}.sk:hover{background:#112a4f}.sk.on{background:#15325c;color:#fff}
.sf{margin-top:auto;border-top:1px solid #1d3558;padding-top:16px;font-size:11.5px;line-height:1.5;color:#7e93b4}.sf strong{display:block;color:#e4ecf8;font-size:12px;margin-bottom:4px}
.top{display:flex;justify-content:flex-end;align-items:center;gap:18px;padding:18px 54px;background:#fff;border-bottom:1px solid var(--line)}
.eng{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);background:none;border:0}.eng i{width:8px;height:8px;border-radius:50%;background:#d44}.eng.ok i{background:#25b37c}
.pg{padding:30px 42px 60px}.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}.ph h1{font-size:40px;letter-spacing:-.01em}.ph p{color:var(--mut);margin:10px 0 0;font-size:14.5px}.pv{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;border-top:3px solid var(--blue)}.panel.gr{border-top-color:var(--green)}
.phd{display:flex;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}.phd h2{font-size:20px}.phd small{color:var(--mut);font-size:12px}
.num{width:30px;height:30px;border-radius:4px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}.num.d{background:var(--navy)}
.fd{display:block;margin-bottom:16px;flex:1}.fd span{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.fd em{color:#d33;font-style:normal;margin-left:2px}
input[type=text],input[type=url],textarea{width:100%;border:1px solid var(--line);background:#fbfdff;border-radius:6px;padding:13px 14px;font:inherit;font-size:13.5px;color:var(--ink);resize:vertical}
input::placeholder,textarea::placeholder{color:#a7b1c2}input:focus,textarea:focus{outline:2px solid #bcd1fa;border-color:var(--blue)}.pair{display:flex;gap:14px}
.drop{border:1.5px dashed #b9c7dc;border-radius:6px;background:#fbfdff;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:20px;color:#7b8db0}.drop.dg{background:#eaf2ff;border-color:var(--blue)}.drop strong{color:var(--ink);font-size:13px;margin-top:4px}.drop small{font-size:11px}.drop .btn{margin-top:10px}
.th{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tb{position:relative}.tb img,.big img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.big{margin-bottom:18px}.big img{width:130px;height:130px;cursor:zoom-in}
.tb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--navy);color:#fff;padding:0;line-height:1}
.ready{margin-top:18px;background:#eaf2fd;border:1px solid #d6e4f8;border-radius:6px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.ready h3{font:600 16px "DM Sans"}.ready small{color:var(--mut)}
.alert{margin-top:16px;background:#fdecec;border:1px solid #f4c3c3;color:#9b2020;border-radius:6px;padding:12px 14px;font-size:13.5px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:6px;overflow-x:auto}.tr{display:grid;grid-template-columns:2.2fr 1.4fr 1.1fr 1fr 1.1fr;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);font-size:13px;gap:12px;min-width:640px}.tr:last-child{border:0}
.tr.h{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#8a96aa;padding:16px 24px}.tr b{display:block}.tr small{color:var(--mut);font-size:11.5px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#4a5870}
.st{font-style:normal;background:#edf1f6;color:#5a6a82;font-weight:600;font-size:12px;padding:8px 12px;border-radius:4px;display:block}.st.an,.s-match{background:#dff3ea;color:#16754f}.s-mismatch,.s-missing{background:#fbe0e0;color:#a52626}.s-unverified{background:#fbefd3;color:#8f6512}
.acts{display:flex;gap:16px;align-items:center}.op{color:var(--blue);font-weight:600;display:inline-flex;gap:4px;align-items:center}.acts button{border:0;background:none;color:#98a3b5;padding:2px}.acts button:hover{color:#c33}
.empty{background:#fff;border:1px dashed #c6d3e6;border-radius:6px;padding:46px;text-align:center}.empty h3{font-size:20px}.empty p{color:var(--mut);margin:8px 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px}.stat b{display:block;font:500 34px "Space Grotesk"}.stat span{color:var(--mut);font-size:12.5px}.sec{font-size:20px;margin-bottom:14px}
.rl{grid-template-columns:2fr 2fr 1fr}.rl:hover{background:#f7faff}
.btns{display:flex;gap:10px;flex-wrap:wrap}.vd{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:24px 28px;margin-bottom:16px;color:#fff;background:#6b7a90}.vd.match{background:var(--green)}.vd.partial{background:#c98a14}.vd.mismatch{background:#c0392b}.vd small{opacity:.85;font-size:12px}.vd h2{font-size:26px;margin-top:4px}.cf{text-align:right}.cf b{font:500 38px "Space Grotesk";display:block}
.rc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:16px}.rc h3{font:600 15px "DM Sans";margin:0 0 10px}.rc h3 small{color:var(--mut);font-weight:400}.rc textarea{margin-bottom:14px}.rc ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:#3a4860}
.cmp .tr{grid-template-columns:1.1fr 1.2fr 1.2fr 1fr 1.8fr;align-items:start}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.okt{color:var(--green);font-size:13px;margin-left:8px}.fine{color:var(--mut);font-size:12.5px;margin-top:24px}.fine a{color:var(--blue)}
@media(max-width:960px){.nav,.hero,.foot{padding-left:24px;padding-right:24px}.sh{margin:0 12px;padding-left:12px;padding-right:12px}.hero{grid-template-columns:1fr}.hero h1{font-size:44px}.steps,.why,.fg,.two,.cols{grid-template-columns:1fr}.nav nav a:not(.btn){display:none}
.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:6px;padding:14px}.sl,.sf,.sk svg:last-child{display:none}.sk{margin:0}.pg{padding:22px 16px}.top{padding:12px 16px}.stats{grid-template-columns:1fr 1fr}.pair{flex-direction:column;gap:0}.ready{flex-direction:column;align-items:stretch}.foot{flex-direction:column;gap:10px;text-align:center}}
@media print{.side,.top,.np{display:none!important}.shell{display:block}.pg{padding:0}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I=(d,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ic={shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',check:'<path d="m5 12 5 5 9-10"/>',spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4m0 3h.01"/>',bars:'<path d="M5 20V10m7 10V4m7 16v-7"/>',up:'<path d="M12 16V8m-4 4 4-4 4 4"/><path d="M20 16.5A4.5 4.5 0 0 0 17 8h-1A6 6 0 1 0 4 14.9"/>',img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',clip:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 13 2 2 4-4"/>',doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6m-6 4h6"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',chev:'<path d="m9 6 6 6-6 6"/>',trash:'<path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/>',hp:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-7h3zM3 19a2 2 0 0 0 2 2h1v-7H3z"/>',dl:'<path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/>',pr:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><rect x="6" y="14" width="12" height="7"/>'};
const S=(k,s)=>I(ic[k],s);
const logo=w=>`<a class="logo" href="#/"><span class="mark">${S("shield")}</span><span class="lt ${w?"w":""}">PROMISE<b>2</b>PROOF</span></a>`;

let db=[];try{db=JSON.parse(localStorage.getItem("p2p")||"[]")}catch{}
const persist=()=>{try{localStorage.setItem("p2p",JSON.stringify(db));return true}catch{alert("Browser storage is full. Delete older records and try again.");return false}};
const getKey=()=>{try{return localStorage.getItem("p2pkey")||""}catch{return""}};
const MODEL="gemini-3.5-flash";
const PROMPT=`You are an evidence-first product verification analyst. Compare the SELLER'S PROMISE with what the buyer RECEIVED, using the buyer's photos and notes. Rules:
- Only report what the images or text actually support. Never invent claims.
- Read visible label text, model numbers, colours, accessories and packaging damage from the photos.
- If something cannot be verified from the evidence, mark it "unverified" and explain why.
- Confidence is a number from 0 to 100 reflecting evidence strength.
Return ONLY JSON: {"verdict":"match|partial|mismatch|inconclusive","confidence":0,"headline":"short title","summary":"2-3 plain sentences","comparisons":[{"attribute":"","promised":"","observed":"","status":"match|mismatch|unverified|missing","confidence":0,"evidence":""}],"missing_accessories":[""],"damage_or_differences":[""],"uncertainty":[""],"suggested_next_steps":[""]}`;

const PROMISE=[["product_name","Product name","e.g. Wireless headphones",1],["brand","Brand","DemoTech"],["model","Model","DT-500"],["listing_url","Listing URL","https://store.example/product"],["description","Description","Paste the seller’s product description",0,1],["advertised_specs","Advertised specifications","Colour: Black · Battery: 40 hours · Bluetooth 5.3",0,1],["included_accessories","Included accessories","Headphones, charging cable, carrying case"],["warranty","Warranty","1 year manufacturer warranty"]];
const RECEIVED=[["received_description","What did you receive?","Describe the product that arrived",0,1],["observed_specs","Observed specifications","Any details you can read from the product or label",0,1],["missing_accessories","Missing accessories","e.g. Carrying case was not in the box"],["damage_notes","Damage or visible differences","Scratches, colour, packaging damage…",0,1]];
const fld=([k,l,p,req,area])=>`<label class="fd"><span>${l}${req?"<em>*</em>":""}</span>${area?`<textarea rows="3" data-k="${k}" placeholder="${esc(p)}">${esc(draft[k]||"")}</textarea>`:`<input type="${k==="listing_url"?"url":"text"}" data-k="${k}" placeholder="${esc(p)}" value="${esc(draft[k]||"")}">`}</label>`;

let draft={},imgs=[];
const shell=(on,body)=>`<div class="shell"><aside class="side">${logo(1)}<div class="sl">WORKSPACE</div>
${[["overview","Overview","grid"],["verify","New verification","clip"],["history","History","hist"]].map(([h,l,i])=>`<a class="sk ${on===h?"on":""}" href="#/${h}">${S(i)}<span>${l}</span>${S("chev",14)}</a>`).join("")}
<div class="sf"><strong>Evidence stays private</strong>Everything is stored in this browser. AI analysis is assistive, not legal proof.</div></aside>
<div><div class="top"><button class="eng ${getKey()?"ok":""}" onclick="setKey()" title="Set Gemini API key"><i></i>${getKey()?"Gemini engine ready":"Add Gemini key"}</button><a class="btn p sm" href="#/verify">Start verification ${S("arrow",14)}</a></div><main class="pg">${body}</main></div></div>`;

function landing(){return `<div class="landing"><header class="nav">${logo()}<nav><a href="#how">How it works</a><a href="#why">Why Promise2Proof</a><a class="btn p" href="#/verify">Open workspace ${S("arrow",16)}</a></nav></header>
<section class="hero"><div><div class="eyebrow"><i></i>CONSUMER EVIDENCE INTELLIGENCE</div><h1>Did you receive<br><span>what you were promised?</span></h1>
<p>Compare the seller’s promise with what arrived at your door — using image evidence, model reading, and uncertainty-aware AI.</p>
<div class="cta"><a class="btn p lg" href="#/verify">Verify your product ${S("arrow",18)}</a><a class="lk" href="#how">Explore the demo ${S("arrow",14)}</a></div>
<div class="trust"><span>${S("shield",16)}Evidence-first</span><span>${S("check",16)}No invented claims</span><span>${S("spark",16)}Gemini vision</span></div></div>
<div class="art"><div class="gb"></div><div class="dc"><div class="live"><i></i>LIVE COMPARISON</div><div class="dr"><div class="tile a">${S("hp",88)}</div><span class="ac">${S("arrow")}</span><div class="tile b"><div class="lb"><small>DT</small>400</div></div></div>
<div class="res">${S("warn",22)}<div><strong>Possible model mismatch</strong><small>Label evidence · 82% confidence</small></div><span class="chip">REVIEW</span></div>
<div class="fl f1">${S("check",14)} Label text detected</div><div class="fl f2">${S("bars",14)} 7 attributes compared</div></div></div></section>
<section id="how" class="sh"><div class="eyebrow x">A CLEARER PATH TO A FAIRER OUTCOME</div><h2>From unboxing to<br><span>evidence in minutes.</span></h2><div class="steps">
${[["up","Bring the promise","Paste the listing details or add a screenshot of what the seller advertised."],["img","Show what arrived","Upload product, label, packaging, and accessory photos from your delivery."],["clip","See the proof","Review every comparison with supporting evidence, confidence, and uncertainty."]].map(([i,t,d],n)=>`<div class="step"><small>0${n+1}</small>${S(i,22)}<h3>${t}</h3><p>${d}</p></div>`).join("")}</div></section>
<section id="why" class="sh why"><div><div class="eyebrow x">BUILT FOR CLARITY</div><h2>Make every detail<br><span>count.</span></h2></div><div class="fg">
${[["shield","Evidence before opinion","AI separates what an image shows from what cannot be verified."],["doc","Complaint-ready reports","Download a structured record you can edit, preserve, and share."],["spark","Made for real unboxings","Read labels, compare colours, and surface accessory gaps."]].map(([i,t,d])=>`<div>${S(i,22)}<h4>${t}</h4><p>${d}</p></div>`).join("")}</div></section>
<footer class="foot">${logo(1)}<span>What you order should be what you receive.</span><span>© ${new Date().getFullYear()} Promise2Proof</span></footer></div>`}

const dateOf=r=>new Date(r.created).toLocaleDateString("en-GB");
const badge=r=>`<i class="st ${r.report?"an":""}">${r.report?"Analysed":"Draft"}</i>`;
const emptyBox=(t,p)=>`<div class="empty"><h3>${t}</h3><p>${p}</p><a class="btn p" href="#/verify">Start verification</a></div>`;
const head=(e,t,p,extra="")=>`<div class="ph"><div><div class="eyebrow x">${e}</div><h1>${t}</h1><p>${p}</p></div>${extra}</div>`;

function overview(){const d=db.filter(r=>r.report),fl=d.filter(r=>["mismatch","partial"].includes(r.report.verdict)).length;
return shell("overview",head("OVERVIEW","Your evidence workspace","Track every order you’ve compared and what the evidence showed.",`<a class="btn p lg" href="#/verify">${S("spark",16)}New verification</a>`)+
`<div class="stats">${[["Verifications",db.length],["Analysed",d.length],["Drafts",db.length-d.length],["Need review",fl]].map(([l,n])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("")}</div><h2 class="sec">Recent verifications</h2>`+
(db.length?`<div class="tbl">${db.slice(0,5).map(r=>`<a class="tr rl" href="#/report/${r.id}"><span><b>${esc(r.product_name)}</b><small>${r.ref}</small></span><span>${r.report?esc(r.report.headline||r.report.verdict):"Draft — not analysed"}</span><span>${badge(r)}</span></a>`).join("")}</div>`:emptyBox("Nothing here yet","Compare your first delivery to its listing.")))}

function history(){return shell("history",head("EVIDENCE TRAIL","Verification history","Revisit reports, export evidence, or remove a record you no longer need.",`<a class="btn p lg" href="#/verify">${S("spark",16)}New verification</a>`)+
(db.length?`<div class="tbl"><div class="tr h"><span>PRODUCT</span><span>REFERENCE</span><span>DATE</span><span>STATUS</span><span>ACTIONS</span></div>${db.map(r=>`<div class="tr"><span><b>${esc(r.product_name.toUpperCase())}</b><small>${esc([r.brand,r.model].filter(Boolean).join(" ").toUpperCase())}</small></span><span class="mono">${r.ref}</span><span>${dateOf(r)}</span><span>${badge(r)}</span><span class="acts"><a class="op" href="#/report/${r.id}">Open ${S("arrow",14)}</a><button aria-label="Delete ${r.ref}" onclick="del('${r.id}')">${S("trash",16)}</button></span></div>`).join("")}</div>`:emptyBox("No verifications yet","Start one to build your first evidence record.")))}

function verify(){return shell("verify",head("NEW VERIFICATION","Compare promise to delivery","Add the seller’s claim, then show us what arrived. We’ll keep uncertainty visible.",`<span class="pv">${S("shield",15)}Private evidence workspace</span>`)+
`<div class="two"><section class="panel"><div class="phd"><b class="num d">01</b><div><h2>What was promised?</h2><small>Seller listing &amp; advertised details</small></div></div>
${fld(PROMISE[0])}<div class="pair">${fld(PROMISE[1])}${fld(PROMISE[2])}</div>${PROMISE.slice(3).map(fld).join("")}</section>
<section class="panel gr"><div class="phd"><b class="num">02</b><div><h2>What was received?</h2><small>Your photos &amp; delivery notes</small></div></div>
<div class="drop" id="drop">${S("up",22)}<strong>Drop evidence photos here</strong><small>Product, label, packaging · JPEG, PNG or WEBP · 8MB max</small><button type="button" class="btn p" onclick="$('#file').click()">Choose images</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div>
<div class="th" id="thumbs"></div>${RECEIVED.map(fld).join("")}</section></div>
<div id="err"></div><div class="ready"><div><h3>Ready to compare?</h3><small>AI will only report what text and evidence can support.</small></div><button class="btn p lg" id="go">${S("spark",18)}Analyse product with AI</button></div>`)}

function bindVerify(){
 document.querySelectorAll("[data-k]").forEach(e=>e.addEventListener("input",()=>draft[e.dataset.k]=e.value));
 const err=m=>$("#err").innerHTML=m?`<div class="alert" role="alert">${esc(m)}</div>`:"";
 const thumbs=()=>{$("#thumbs").innerHTML=imgs.map((s,i)=>`<div class="tb"><img src="${s}" alt="Evidence photo ${i+1}"><button type="button" aria-label="Remove photo ${i+1}" onclick="imgs.splice(${i},1);bindThumbs()">×</button></div>`).join("")};
 window.bindThumbs=thumbs;thumbs();
 const add=async list=>{err("");for(const f of list){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){err(`${f.name}: use JPEG, PNG or WEBP images.`);continue}if(f.size>8*1024*1024){err(`${f.name} is larger than 8MB.`);continue}imgs.push(await shrink(f))}thumbs()};
 $("#file").onchange=e=>{add([...e.target.files]);e.target.value=""};
 const dz=$("#drop");dz.ondragover=e=>{e.preventDefault();dz.classList.add("dg")};dz.ondragleave=()=>dz.classList.remove("dg");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("dg");add([...e.dataTransfer.files])};
 $("#go").onclick=async()=>{
  if(!(draft.product_name||"").trim())return err("Enter the product name to continue.");
  if(!imgs.length&&!(draft.received_description||"").trim())return err("Add at least one photo or describe what you received.");
  const id=crypto.randomUUID?crypto.randomUUID():String(Date.now());
  const r={id,ref:"P2P-"+id.replace(/-/g,"").slice(0,8).toUpperCase(),created:new Date().toISOString(),...draft,images:[...imgs],report:null};
  db.unshift(r);if(!persist()){db.shift();return}
  draft={};imgs=[];
  if(!getKey()&&!setKey()){location.hash="#/report/"+id;return}
  $("#go").disabled=true;$("#go").textContent="Comparing promise to delivery…";
  try{await analyze(id)}catch(e){sessionStorage.setItem("p2perr",e.message)}
  location.hash="#/report/"+id};
}

function shrink(f){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1024,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.src=fr.result};fr.readAsDataURL(f)})}

function setKey(){const k=prompt("Paste your Gemini API key (free at aistudio.google.com/apikey). It stays in this browser and is only sent to Google.",getKey());
 if(k===null)return !!getKey();try{k.trim()?localStorage.setItem("p2pkey",k.trim()):localStorage.removeItem("p2pkey")}catch{}route();return !!getKey()}

async function analyze(id){
 const r=db.find(x=>x.id===id),k=getKey();if(!k)throw new Error("Add your Gemini API key (top right), then run the analysis.");
 const f=(t,ks)=>t+"\n"+ks.filter(x=>r[x]).map(x=>`${x}: ${r[x]}`).join("\n");
 const text=PROMPT+"\n\n"+f("SELLER'S PROMISE",["product_name","brand","model","listing_url","description","advertised_specs","included_accessories","warranty"])+"\n\n"+f("BUYER'S DELIVERY NOTES",["received_description","observed_specs","missing_accessories","damage_notes"]);
 const parts=[{text},...r.images.map(s=>({inline_data:{mime_type:"image/jpeg",data:s.split(",")[1]}}))];
 let res;try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":k},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:.2,responseMimeType:"application/json"}})})}catch{throw new Error("Could not reach Gemini. Check your connection and try again.")}
 if(!res.ok)throw new Error(`Gemini request failed (${res.status}). Check your API key and try again.`);
 let rep;try{rep=JSON.parse((await res.json()).candidates[0].content.parts[0].text)}catch{throw new Error("Gemini returned an unreadable response. Please try again.")}
 rep.notes=r.report?.notes||"";r.report=rep;persist();
}

const VER={match:"Matches the promise",partial:"Partly matches",mismatch:"Does not match",inconclusive:"Inconclusive"};
const ul=(t,a)=>(a||[]).filter(Boolean).length?`<div class="rc"><h3>${t}</h3><ul>${a.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
function report(id){const r=db.find(x=>x.id===id);if(!r)return shell("history",emptyBox("Record not found","It may have been deleted."));
 const p=r.report,e=sessionStorage.getItem("p2perr");sessionStorage.removeItem("p2perr");
 return shell("history",head(r.ref,esc(r.product_name),esc([r.brand,r.model].filter(Boolean).join(" · "))||"Verification report",
 `<div class="btns np">${p?`<button class="btn g" onclick="exportJson('${id}')">${S("dl",16)}Export JSON</button><button class="btn g" onclick="print()">${S("pr",16)}Print</button>`:""}<button class="btn p" id="run">${S("spark",16)}${p?"Re-run analysis":"Analyse with AI"}</button></div>`)+
 `<div id="rerr">${e?`<div class="alert" role="alert">${esc(e)}</div>`:""}</div>`+
 (r.images.length?`<div class="th big">${r.images.map((s,i)=>`<a href="${s}" target="_blank" rel="noreferrer"><img src="${s}" alt="Delivery evidence ${i+1}"></a>`).join("")}</div>`:"")+
 (!p?`<div class="empty"><h3>This record is a draft</h3><p>Your evidence is saved. Run the analysis to see how the delivery compares with the promise.</p></div>`:
 `<div class="vd ${esc(p.verdict)}"><div><small>${VER[p.verdict]||esc(p.verdict)}</small><h2>${esc(p.headline)}</h2></div><div class="cf"><b>${Math.round(p.confidence)}%</b><small>confidence</small></div></div>
 <div class="rc"><h3>Summary <small>(editable)</small></h3><textarea id="sum" rows="4">${esc(p.summary)}</textarea><h3>Your notes</h3><textarea id="notes" rows="3" placeholder="Add order number, seller messages, dates…">${esc(p.notes)}</textarea><div class="np"><button class="btn p sm" id="sv">Save changes</button><span class="okt" id="ok"></span></div></div>
 <div class="tbl cmp"><div class="tr h"><span>ATTRIBUTE</span><span>PROMISED</span><span>OBSERVED</span><span>STATUS</span><span>EVIDENCE</span></div>${(p.comparisons||[]).map(c=>`<div class="tr"><span><b>${esc(c.attribute)}</b></span><span>${esc(c.promised)||"—"}</span><span>${esc(c.observed)||"—"}</span><span><i class="st s-${esc(c.status)}">${esc(c.status)} · ${Math.round(c.confidence)}%</i></span><span>${esc(c.evidence)}</span></div>`).join("")}</div>
 <div class="cols">${ul("Missing accessories",p.missing_accessories)}${ul("Damage or differences",p.damage_or_differences)}${ul("What can’t be verified",p.uncertainty)}${ul("Suggested next steps",p.suggested_next_steps)}</div>
 <p class="fine">AI analysis is assistive, not legal proof. <a href="#/history">Back to history</a></p>`))}

function bindReport(id){const r=db.find(x=>x.id===id);if(!r)return;
 $("#run").onclick=async()=>{if(!getKey()&&!setKey())return;$("#run").disabled=true;$("#run").textContent="Analysing…";try{await analyze(id);route()}catch(e){$("#rerr").innerHTML=`<div class="alert" role="alert">${esc(e.message)}</div>`;$("#run").disabled=false;$("#run").textContent="Try again"}};
 if($("#sv"))$("#sv").onclick=()=>{r.report.summary=$("#sum").value;r.report.notes=$("#notes").value;if(persist()){$("#ok").textContent="Saved";setTimeout(()=>$("#ok").textContent="",2000)}}}

function del(id){const r=db.find(x=>x.id===id);if(r&&confirm(`Delete ${r.ref}? This removes its photos and report.`)){db=db.filter(x=>x.id!==id);persist();route()}}
function exportJson(id){const r=db.find(x=>x.id===id),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...r,images:r.images.length+" image(s) omitted"},null,2)],{type:"application/json"}));a.download=r.ref+".json";a.click();URL.revokeObjectURL(a.href)}

function route(){const h=location.hash.replace(/^#\/?/,""),[pg,id]=h.split("/"),app=$("#app");
 if(["how","why"].includes(pg)){return}
 if(pg==="overview")app.innerHTML=overview();else if(pg==="history")app.innerHTML=history();else if(pg==="verify"){app.innerHTML=verify();bindVerify()}else if(pg==="report"){app.innerHTML=report(id);bindReport(id)}else app.innerHTML=landing();
 window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
